<!DOCTYPE html>
<html lang="pt_BR">
    <head>
        <meta charset="UTF-8">
        <meta name="vieport" content="width=device-width, initial-scale=1.0">
        <title>EoThawn Board</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>EoThawn Board</h1>
            <h2>O calendário ideal para uma vida veloz!</h2>


        </header>

        <div class="agenda">

        <div class="dia">
            <h2>Segunda</h2>
            <div id="segunda-lista"></div>
        </div>

        <div class="dia">
            <h2>Terça</h2>
            <div id="terca-lista"></div>
        </div>

        <div class="dia">
            <h2>Quarta</h2>
            <div id="quarta-lista"></div>
        </div>

        <div class="dia">
            <h2>Quinta</h2>
            <div id="quinta-lista"></div>
        </div>

        <div class="dia">
            <h2>Sexta</h2>
            <div id="sexta-lista"></div>
        </div>

        <div class="dia">
            <h2>Sabado</h2>
            <div id="sabado-lista"></div>
        </div>

        <div class="dia">
            <h2>Domingo</h2>
            <div id="domingo-lista"></div>
        </div>

        </div>

        <button class="botao-flutuante" id="btnNovaTarefa"></button>

        <div id="formulario" class="formularioTarefas">
            <form>

        <label>Qual a tarefa?</label>
        <input type="text" id="tarefa">

        <label>Qual o dia da tarefa?</label>
        <select id="dia">
            <option>Segunda</option>
            <option>Terça</option>
            <option>Quarta</option>
            <option>Quinta</option>
            <option>Sexta</option>
            <option>Sábado</option>
            <option>Domingo</option>
        </select>

        <label>Qual o horário da tarefa?</label>
        <input type="time" id="horario">

        <button type="submit">
            Salvar
        </button>

    </form>
</div>
    <script src="script.js"></script>

    </body>
</html>
